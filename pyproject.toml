[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-protocol"
version = "0.2.0"
description = "Compact binary encoding for JSON-like values, with measured size comparisons versus JSON."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  { name = "Michael L. McKnight", email = "ml.innovation.research.lab@gmail.com" },
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ZodiacDog/FLUX"
Repository = "https://github.com/ZodiacDog/FLUX"

[tool.setuptools.packages.find]
include = ["flux_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
